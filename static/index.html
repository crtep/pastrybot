<!-- deferred so the page (and the first article) shows before the 2 MB bundle arrives -->
<script defer src="https://unpkg.com/@strudel/repl@1.3.0"></script>
<style>
  /* Solarized light: https://ethanschoonover.com/solarized/ */
  :root {
    --base03: #002b36; --base02: #073642; --base01: #586e75; --base00: #657b83;
    --base0: #839496; --base1: #93a1a1; --base2: #eee8d5; --base3: #fdf6e3;
    --orange: #cb4b16; --red: #dc322f;

    --bg: var(--base3); --rule: var(--base2);
    --text: var(--base01); --body: var(--base00); --dim: var(--base1);
    --accent: var(--orange);
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --serif: Newsreader, Georgia, serif;
    --col: 760px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--body); }
  body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
  /* one centered column; everything hangs from its left edge */
  .col { width: min(var(--col), 100% - 48px); margin-inline: auto; }

  header { display: flex; align-items: center; gap: 16px; padding-top: 36px; }
  h1 {
    margin: 0; font: 500 26px/1 var(--mono); letter-spacing: -.02em; color: var(--text);
    text-box: trim-both ex alphabetic; /* trim to the x-height, so centring aligns with the lowercase letters */
  }
  #sound { margin-left: auto; flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; }
  #sound:hover:not(:disabled) { color: var(--accent); }
  #sound:disabled { opacity: .35; cursor: default; }
  #sound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #sound .on, body.audible #sound .off { display: none; }
  body.audible #sound .on { display: block; }

  .timeline { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  #progress { flex: 1; height: 1px; background: var(--rule); }
  #progress > div { height: 1px; width: 0; background: var(--dim); }
  #progress.ready > div { background: var(--accent); }

  #error { display: flex; gap: 12px; align-items: baseline; margin-top: 14px; font: 400 13px/1.5 var(--mono); color: var(--red); }
  #error[hidden] { display: none; }
  #error-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* what the model is listening to: the Wikipedia article */
  /* the article and footer take at most a third of the screen (dvh: the visible height on
     mobile, as toolbars come and go); a long article scrolls inside it */
  .bottom { display: flex; flex-direction: column; max-height: 33.33vh; max-height: 33.33dvh; }
  .listening { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 24px 0 20px; border-top: 1px solid var(--rule); }
  .bottom footer { flex: none; }
  footer { padding-bottom: 24px; font: 400 12px/1.5 var(--mono); color: var(--dim); }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  footer a:hover { color: var(--accent); text-decoration-color: currentColor; }
  #article {
    margin: 0; font: 400 16px/1.55 var(--serif); color: var(--body);
    /* plain greedy wrapping: appending "Up next…" never re-breaks the lines before it */
    text-wrap: wrap; text-align: left; hyphens: manual;
  }
  #article a { color: var(--text); font-style: italic; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--dim); }
  #article a:hover { color: var(--accent); text-decoration-color: currentColor; }
  #article .next { font-style: italic; color: var(--dim); }
  #article .next a { color: var(--dim); }
  #article.waiting { font-style: italic; color: var(--dim); }

  /* 6px of margin (not padding) at each end keeps the scrollbar clear of the rules above and below */
  main { min-width: 0; overflow: auto; margin-block: 6px; padding: 30px 0 26px; }
  /* always the first line above the code, read as a comment:
     "// gpt-6-luna is writing..." then "// gpt-6-luna wrote 1238 tokens" */
  #writing { font: 400 15px/1.75 var(--mono); color: var(--base1); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #writing .dots { display: none; }
  body.writing #writing .dots { display: inline; }
  /* a slow, soft wave through the dots: each fades up and down in turn */
  #writing .dots span { opacity: .2; animation: wave 2.4s ease-in-out infinite; }
  #writing .dots span:nth-child(2) { animation-delay: .3s; }
  #writing .dots span:nth-child(3) { animation-delay: .6s; }
  @keyframes wave { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  @media (max-width: 640px) { #writing { font-size: 13px; } }

  /* the editor: no gutter, no box, just code on the page */
  #code .cm-editor { background: transparent !important; }
  /* Strudel wraps each line's text in an inline-styled span with a translucent white background and
     a slight invert (for legibility over its visuals); WebKit shows it as a band behind every line */
  #code .cm-line > span[style*="background-color"] { background: none !important; filter: none !important; }
  /* Strudel's editor starts in its dark default theme (with "// LOADING") before we switch it
     to Solarized light: keep its container transparent, and hidden until it's set up */
  #code > div:not(#writing) { background: transparent !important; }
  #code:not(.ready) > div:not(#writing) { visibility: hidden; }
  #code .cm-gutters { display: none !important; }
  #code .cm-content { padding: 0; }
  #code .cm-line { padding: 0; line-height: 1.75; }
  #code .cm-activeLine { background: transparent; }
  #code .cm-focused { outline: none; }
  /* read-only: no caret (the model's changes arrive through setCode, not typing) */
  #code .cm-content { caret-color: transparent; }
  #code .cm-cursorLayer { display: none; }
  /* playing notes: Strudel draws a 2px inline-style outline; a soft accent tint instead */
  #code .cm-line [style*="outline"] { outline: none !important; background: rgba(203, 75, 22, .16); border-radius: 2px; }

  /* thin rounded scrollbars in Solarized tones */
  main, .cm-scroller, .listening { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  main::-webkit-scrollbar, .cm-scroller::-webkit-scrollbar, .listening::-webkit-scrollbar { width: 10px; height: 10px; }
  main::-webkit-scrollbar-track, .cm-scroller::-webkit-scrollbar-track, .listening::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb, .cm-scroller::-webkit-scrollbar-thumb, .listening::-webkit-scrollbar-thumb { background: var(--rule); border: 3px solid var(--bg); border-radius: 999px; }
  main::-webkit-scrollbar-thumb:hover, .cm-scroller::-webkit-scrollbar-thumb:hover, .listening::-webkit-scrollbar-thumb:hover { background: var(--dim); }
</style>
</head>
<body>
<div class="col">
  <header>
    <h1>pastrybot</h1>
    <button id="sound" disabled aria-label="Start">
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button>
  </header>
  <div class="timeline"><div id="progress"><div></div></div></div>
  <div id="error" hidden><span id="error-text"></span></div>
</div>
<main class="col" id="code"><div id="writing" aria-live="polite"><span id="writing-text"></span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div><strudel-editor id="repl"></strudel-editor></main>
<div class="bottom">
<section class="col listening">
  <p id="article" class="waiting">Waiting for the first article…</p>
</section>
<footer class="col">app by <a href="https://crtep.com">Carter Teplica</a> (and Opus 5.5) · <a href="https://github.com/crtep/pastrybot">source</a> · made with <a href="https://strudel.cc">Strudel</a></footer>
</div>

<script>
// Every top-level name here is a const: Strudel copies its own functions (evaluate, start, ...)
// onto the global object when it loads, which would silently replace plain function declarations.
const $ = (id) => document.getElementById(id);
const repl = $('repl');

// ---- the station: one shared version of the code, on a clock-aligned 30-second grid.
// The server decides what plays when; this page keeps its clock in step with the server's,
// joins the music at the cycle everyone else is on, and swaps versions exactly on the marks.
const POLL_MS = 2000;          // while the tab is visible
const POLL_HIDDEN_MS = 10000;  // in a background tab
const LEAD_SECONDS = 1.0;      // evaluate the next version this long before its mark
const MAX_ERROR_SECONDS = 0.03; // how far from the clock this browser may drift before it's nudged back
const clientId = crypto.randomUUID();

let station = null;       // the latest /api/sync response
let started = false;      // pressed play (or the browser allowed autoplay)
let muted = false;        // silences this browser only; the station keeps going

// Clock sync: the offset from this browser's clock to the server's, from the sample with the
// shortest round trip (least uncertainty) among recent ones.
const clockSamples = [];
let offsetMs = 0;
const serverNow = () => (Date.now() + offsetMs) / 1000;
const turnSeconds = () => station.turn_seconds;
const startOf = (version) => version.start_turn * turnSeconds();

// Playback. Scheduler cycles are counted from `live.origin`, which is cycle 0 of the version
// whose timeline we're on, at wall time `live.startWall`. Each version starts at its own cycle 0.
let live = null;          // {version, origin, cps, startWall}
let currentPattern = null; // what's playing, in scheduler cycles
let armed = null;         // the next version, evaluated and spliced in, waiting for its mark
let tempoChange = null;   // {cycle, cps}: the next version's setcpm, held until its mark
let applying = false;
let playingId = null;     // the version whose pattern is audible (runtime errors belong to it)
const reports = new Map(); // version id -> {eval_error, runtime_errors}
const scheduler = () => repl.editor.repl.scheduler;

const log = function log(text, level = 'info') {
  (level === 'err' ? console.warn : console.info)(`[${new Date().toLocaleTimeString()}] ${text}`);
}

const report = function report(versionId) {
  if (!reports.has(versionId)) reports.set(versionId, { version_id: versionId, eval_error: null, runtime_errors: [] });
  return reports.get(versionId);
}

// Runtime errors Strudel logs while a pattern plays (e.g. unknown sounds), reported to the server.
document.addEventListener('strudel.log', (e) => {
  const { message, type } = e.detail;
  if (playingId === null || !(type === 'error' || /error|not found/i.test(message))) return;
  if (message.startsWith('[eval]')) return; // eval errors are reported separately
  const r = report(playingId);
  if (!r.runtime_errors.includes(message) && r.runtime_errors.length < 10) {
    r.runtime_errors.push(message);
    log(message, 'err');
  }
});

const isListening = () => started && !muted && document.visibilityState === 'visible';

// ---- talking to the server
const sync = async function sync() {
  const known = new Set((station?.versions ?? []).map((v) => v.id));
  for (const id of reports.keys()) if (station && !known.has(id)) reports.delete(id);
  const body = { client_id: clientId, listening: isListening(), reports: [...reports.values()] };
  const t0 = Date.now();
  const res = await fetch('api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const t1 = Date.now();
  if (!res.ok) throw new Error(`sync failed (HTTP ${res.status}): ${await res.text()}`);
  const data = await res.json();
  clockSamples.push({ rtt: t1 - t0, offset: data.server_time * 1000 - (t0 + t1) / 2 });
  if (clockSamples.length > 15) clockSamples.shift();
  offsetMs = clockSamples.reduce((best, s) => (s.rtt < best.rtt ? s : best)).offset;
  station = data;
  showStation();
}

const pollForever = async function pollForever() {
  for (;;) {
    try {
      await sync();
      $('error').hidden = !station.error;
    } catch (err) {
      log(String(err), 'err');
      $('error-text').textContent = "can't reach the station; retrying…";
      $('error').hidden = false;
    }
    await new Promise((r) => setTimeout(r, document.visibilityState === 'visible' ? POLL_MS : POLL_HIDDEN_MS));
  }
}

// The newest version that has started (by the synced clock), and the next scheduled one.
const startedVersions = () => station.versions.filter((v) => startOf(v) <= serverNow());
const nextVersion = () => station.versions.find((v) => startOf(v) > serverNow()) ?? null;

// ---- joining: evaluate the playing version and start the scheduler at everyone's cycle
const evaluate = async function evaluate(version) {
  const editor = repl.editor;
  const s = scheduler();
  const oldCps = s.cps;
  editor.setCode(version.code);
  await editor.evaluate(false);
  const err = editor.repl.state.evalError;
  if (err) {
    if (s.cps !== oldCps) s.setCps(oldCps);
    report(version.id).eval_error = String(err.message ?? err);
    log(`version ${version.id} failed to evaluate: ${err.message ?? err}`, 'err');
    return null;
  }
  return { pattern: editor.repl.state.pattern, cps: s.cps };
}

// Beat sync. How late (in seconds; negative = early) this browser plays relative to the shared
// clock: when the scheduler's anchor cycle actually comes out of the speakers (the audio
// context's output timestamp maps audio time to real time, including device latency), versus
// when the clock says that cycle should be heard. Null until the scheduler has ticked.
const timelineError = () => {
  const s = scheduler();
  const ts = getAudioContext().getOutputTimestamp();
  if (!live || !s.started || s.seconds_at_cps_change === undefined || !ts.performanceTime) return null;
  const anchorCycle = s.num_cycles_at_cps_change;
  const anchorAudioTime = s.seconds_at_cps_change + s.latency;
  const heardMs = performance.timeOrigin + ts.performanceTime + (anchorAudioTime - ts.contextTime) * 1000;
  const heard = (heardMs + offsetMs) / 1000;
  const due = live.startWall + (anchorCycle - live.origin) / live.cps;
  return heard - due;
};

// Nudge the scheduler's cycle position so it plays on the clock again (a small seek).
const correctTimeline = (threshold) => {
  const error = timelineError();
  if (error === null || Math.abs(error) <= threshold) return error;
  const s = scheduler();
  const cycles = error * s.cps;
  s.num_cycles_at_cps_change += cycles;
  s.lastEnd += cycles;
  log(`was ${(error * 1000).toFixed(0)} ms off the clock; corrected`);
  return error;
};

// First guess at the wall time a cycle queried now will be heard (the correction above fixes the rest).
const audibleNow = function audibleNow() {
  const ctx = getAudioContext();
  return serverNow() + 0.01 + scheduler().latency + (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
}

const join = async function join() {
  applying = true;
  getAudioContext().resume(); // iOS suspends audio in background tabs
  const s = scheduler();
  if (s.started) s.stop();
  live = null; armed = null; tempoChange = null; playingId = null;
  // Everyone plays the newest version that evaluates; if it fails, the one before keeps playing.
  const candidates = startedVersions().reverse();
  for (const version of candidates) {
    const result = await evaluate(version);
    if (!result) continue;
    live = { version, origin: 0, cps: result.cps, startWall: startOf(version) };
    currentPattern = result.pattern;
    await s.setPattern(currentPattern, false);
    s.lastEnd = result.cps * (audibleNow() - live.startWall);
    await s.start();
    playingId = version.id;
    $('code').classList.add('ready');
    log(`joined version ${version.id} at cycle ${s.lastEnd.toFixed(2)}`);
    // once the scheduler has ticked, get it onto the clock; the audio clock can still be warming
    // up at first, so check a few times
    for (const ms of [500, 1500, 3000]) setTimeout(() => correctTimeline(0.005), ms);
    // show the newest version's code even if it's the one that failed (that's what everyone sees)
    if (candidates[0] !== version) repl.editor.setCode(candidates[0].code);
    break;
  }
  applying = false;
}

// ---- the next version: evaluate it just before its mark and splice it in exactly on the mark
const arm = async function arm(version) {
  applying = true;
  const s = scheduler();
  const mark = startOf(version);
  const boundary = live.origin + live.cps * (mark - live.startWall);
  const oldCps = s.cps;
  const oldPattern = currentPattern;
  const result = await evaluate(version);
  if (!result) {
    armed = { version, failed: true, mark };
    await s.setPattern(oldPattern); // keep playing what was playing
  } else {
    if (result.cps !== oldCps) {
      s.setCps(oldCps);
      tempoChange = { cycle: boundary, cps: result.cps };
    }
    const shifted = result.pattern.late(boundary); // its cycle 0 lands on the mark
    const before = (h) => h.whole && Number(h.whole.begin) < boundary;
    await s.setPattern(oldPattern.filterHaps(before).stack(shifted.filterHaps((h) => !before(h))));
    armed = { version, failed: false, mark, boundary, cps: result.cps, pattern: shifted };
  }
  applying = false;
}

const goLive = function goLive(a) {
  if (a.failed) return; // the previous version keeps playing, on its own timeline
  live = { version: a.version, origin: a.boundary, cps: a.cps, startWall: a.mark };
  currentPattern = a.pattern;
  playingId = a.version.id;
  // stay on the clock (checked on the mark, where the music changes anyway)
  setTimeout(() => correctTimeline(MAX_ERROR_SECONDS), 300);
}

const tick = function tick() {
  if (!station || !started || applying) return;
  const s = scheduler();
  if (live === null) {
    if (startedVersions().length) join(); // nothing was playing yet (e.g. the very first version)
    return;
  }
  if (tempoChange && s.lastEnd >= tempoChange.cycle) {
    s.setCps(tempoChange.cps);
    tempoChange = null;
  }
  if (armed && serverNow() >= armed.mark) {
    const a = armed;
    armed = null;
    goLive(a);
    return;
  }
  const next = nextVersion();
  if (!armed && next && startOf(next) - serverNow() <= LEAD_SECONDS) arm(next);
}

// Background tabs get throttled timers and can fall out of step: rejoin on coming back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && started) join();
});

// ---- mute: Strudel's master output gain. Strudel can rebuild this node (e.g. when effects
// reset), so the mute is re-applied to whichever node is current on every frame.
const applyMute = function applyMute() {
  if (!started || !live) return;
  const gain = getSuperdoughAudioController().output.destinationGain;
  const target = muted ? 0 : 1;
  if (gain.__target === target) return;
  gain.gain.setTargetAtTime(target, gain.context.currentTime, 0.02);
  gain.__target = target;
}

// ---- what's on screen
const modelId = (id) => id.replace(/^openrouter:/, '').split('/').pop();
let shownArticle = null, shownUpcoming = null, shownCodeId = null;

const showStation = function showStation() {
  const w = station.writing;
  $('writing-text').textContent = !w ? ''
    : w.active ? `// ${modelId(w.model)} is writing`
    : `// ${modelId(w.model)} wrote ${w.output_tokens} tokens`;
  document.body.classList.toggle('writing', !!w?.active);
  $('error-text').textContent = "the model couldn't write the last turn; it'll try again";

  // before pressing play, show the code everyone is hearing
  if (!started) {
    const current = startedVersions().at(-1);
    if (current && repl.editor && current.id !== shownCodeId) {
      repl.editor.setCode(current.code);
      shownCodeId = current.id;
    }
  }

  const a = station.article, u = station.upcoming;
  if (a && (a.url !== shownArticle?.url || u?.url !== shownUpcoming?.url)) {
    shownArticle = a;
    shownUpcoming = u;
    renderArticle(a, u);
  }
}

// Wikipedia's intro, with its subject (bold in Wikipedia's HTML) as the link.
const renderArticle = function renderArticle(article, upcoming) {
  const p = $('article');
  p.classList.remove('waiting');
  p.replaceChildren();
  const link = (text, url) => Object.assign(document.createElement('a'), { textContent: text, href: url, target: '_blank', rel: 'noopener' });

  // Rebuild the text from Wikipedia's extract_html, keeping only words; the first <b>
  // (the article's subject as it appears in the sentence) becomes the link.
  const doc = new DOMParser().parseFromString(article.extract_html, 'text/html');
  let linked = false;
  const walk = (node) => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) p.append(child.textContent.replace(/\s+/g, ' '));
      else if (child.nodeName === 'B' && !linked) { p.append(link(child.textContent, article.url)); linked = true; }
      else walk(child);
    }
  };
  walk(doc.body);
  // No bolded subject in the extract (rare): lead with the title so there's still a link.
  if (!linked) p.prepend(link(article.title, article.url), ': ');
  p.normalize();
  p.firstChild.textContent = p.firstChild.textContent.trimStart();
  p.lastChild.textContent = p.lastChild.textContent.trimEnd();

  if (upcoming) {
    const next = document.createElement('span');
    next.className = 'next';
    next.append('Up next: ', link(upcoming.title, upcoming.url), '.');
    p.append(' ', next);
  }
}

// Every animation frame: the progress through the current 30 s (straight from the synced clock),
// and the speaker icon.
const draw = function draw() {
  if (station) {
    const fraction = (serverNow() % turnSeconds()) / turnSeconds();
    $('progress').firstElementChild.style.width = `${fraction * 100}%`;
    $('progress').className = nextVersion() ? 'ready' : '';
  }
  document.body.classList.toggle('audible', started && !muted);
  $('sound').setAttribute('aria-label', !started ? 'Start' : muted ? 'Unmute' : 'Mute');
  applyMute();
  requestAnimationFrame(draw);
}

// Only the model writes the code. Strudel doesn't expose CodeMirror's read-only setting, so
// stop edits (and Strudel's own shortcuts like Ctrl+Enter / Ctrl+.) before the editor sees
// them. Selecting, copying and moving around still work.
const makeReadOnly = function makeReadOnly(root) {
  const navigation = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End']);
  const block = (e) => { e.preventDefault(); e.stopPropagation(); };
  root.addEventListener('keydown', (e) => {
    if (navigation.has(e.key)) return;
    if ((e.metaKey || e.ctrlKey) && !e.altKey && ['c', 'a'].includes(e.key.toLowerCase())) return; // copy, select all
    if (e.key === 'Tab') { e.stopPropagation(); return; } // let Tab move focus instead of indenting
    block(e);
  }, true);
  for (const type of ['beforeinput', 'paste', 'cut', 'drop']) root.addEventListener(type, block, true);
}

const start = async function start() {
  started = true;
  log('listening');
  await join();
}

// The first press starts listening (browsers only allow sound after an interaction, unless
// they allow autoplay); after that it mutes and unmutes this browser.
$('sound').onclick = () => {
  // iOS: play as music, so the ring/silent switch doesn't mute it (Safari 17+), and resume the
  // audio context synchronously inside the tap, or iOS won't let it make sound
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  getAudioContext().resume();
  if (!started) {
    start();
    return;
  }
  muted = !muted;
  log(muted ? 'muted' : 'unmuted');
};

// Surface anything unexpected in the console.
window.addEventListener('unhandledrejection', (e) => log(`error: ${e.reason?.stack ?? e.reason}`, 'err'));

(async () => {
  pollForever();
  requestAnimationFrame(draw);
  // the web component creates its editor once Strudel's (deferred) bundle has loaded
  while (!repl.editor) await new Promise((r) => setTimeout(r, 50));
  if (station) showStation();
  repl.editor.setFontFamily("'IBM Plex Mono', monospace");
  const narrow = matchMedia('(max-width: 640px)');
  const sizeCode = () => repl.editor.setFontSize(narrow.matches ? 13 : 15);
  sizeCode();
  narrow.onchange = sizeCode;
  makeReadOnly($('code'));
  repl.editor.setTheme('solarizedLight');
  repl.editor.setLineWrappingEnabled(true);
  $('code').classList.add('ready');
  setInterval(tick, 50);
  await repl.editor.prebaked;
  while (!station) await new Promise((r) => setTimeout(r, 100));
  $('sound').disabled = false;
  // autoplay: if the browser lets the audio context run without a click, just start
  const ctx = getAudioContext();
  await Promise.race([ctx.resume(), new Promise((r) => setTimeout(r, 300))]);
  if (ctx.state === 'running' && !started) start();
})();
</script>
</body>
